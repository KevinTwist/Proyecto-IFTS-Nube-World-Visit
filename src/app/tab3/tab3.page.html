<app-header></app-header>

<ion-content class="profile-page">
  <div class="profile-container">

    <div class="user-section">
      <p class="user-label">Usuario</p>
      <h1 class="user-email">{{ email || 'Sin sesión' }}</h1>
    </div>

    <div class="favorites-pill">
      <ion-icon name="heart" class="heart-icon"></ion-icon>
      <span class="favorites-count">{{ favoritesCount }}</span>
      <span class="favorites-text">Países Favoritos</span>
    </div>

    <ion-button expand="block" fill="outline" class="logout-btn" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar sesión
    </ion-button>

  </div>
</ion-content>
